name: CI (Build & Demo)

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-demo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        llvm_version: [ "18", "21" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup LLVM apt for ${{ matrix.llvm_version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-${{ matrix.llvm_version }} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y \
            clang-${{ matrix.llvm_version }} \
            llvm-${{ matrix.llvm_version }} llvm-${{ matrix.llvm_version }}-dev lld-${{ matrix.llvm_version }} \
            cmake ninja-build build-essential graphviz

      - name: Configure
        run: |
          cmake -G Ninja -S . -B build \
            -DLT_LLVM_INSTALL_DIR=/usr/lib/llvm-${{ matrix.llvm_version }}

      - name: Build
        run: cmake --build build

      - name: Run demo script
        env:
          LLVM_VERSION: ${{ matrix.llvm_version }}
        run: |
          bash demo/run.sh "${LLVM_VERSION}"

      - name: Upload demo artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo-artifacts-llvm${{ matrix.llvm_version }}
          path: demo/out/
